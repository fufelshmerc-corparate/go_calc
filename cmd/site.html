<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expression Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        input, button {
            margin: 5px 0;
            padding: 10px;
            font-size: 16px;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Expression Calculator</h1>

    <h2>Добавить выражение</h2>
    <input type="text" id="expressionInput" placeholder="Введите выражение (например, 2+2*2)">
    <button onclick="addExpression()">Отправить</button>
    <p id="expressionResult"></p>


    <h2>Список выражений</h2>
    <button onclick="getExpressions()">Получить список</button>
    <pre id="expressionsList"></pre>

    <h2>Получить выражение по ID</h2>
    <input type="text" id="expressionIdInput" placeholder="Введите ID">
    <button onclick="getExpressionById()">Получить</button>
    <pre id="expressionByIdResult"></pre>

    <script>
        const baseUrl = `http://localhost:8082`;

        async function addExpression() {
    const expression = document.getElementById('expressionInput').value;
    if (!expression) {
        alert("Введите выражение!");
        return;
    }

    try {
        const response = await fetch(`http://localhost:8082/api/v1/calculate`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ expression }),
        });

        if (!response.ok) {
            const errorText = await response.text(); 
            throw new Error(`Ошибка сервера: ${errorText}`);
        }

        const result = await response.json();

        if (!result.id) {
            throw new Error("Ответ сервера не содержит ID");
        }

        document.getElementById('expressionResult').innerText = `Выражение добавлено! ID: ${result.id}`;
    } catch (error) {

        document.getElementById('expressionResult').innerText = `Ошибка: ${error.message}`;
    }
}

        async function getExpressions() {
            try {
                const response = await fetch(`${baseUrl}/api/v1/expressions`);
                if (!response.ok) {
                    throw new Error(`Ошибк: ${response.statusText}`);
                }

                const data = await response.json();
                document.getElementById('expressionsList').innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('expressionsList').innerText = `Ошибкf: ${error.message}`;
            }
        }

        async function getExpressionById() {
            const id = document.getElementById('expressionIdInput').value;
            if (!id) {
                alert("Введите ID!");
                return;
            }

            try {
                const response = await fetch(`${baseUrl}/api/v1/expressions/${id}`);
                if (!response.ok) {
                    throw new Error(`Ошибка: ${response.statusText}`);
                }

                const data = await response.json();
                document.getElementById('expressionByIdResult').innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('expressionByIdResult').innerText = `Ошибка: ${error.message}`;
            }
        }
    </script>
</body>
</html>
